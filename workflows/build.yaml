name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o storm .
      - uses: actions/upload-artifact@v4
        with:
          name: storm-linux-amd64
          path: storm
