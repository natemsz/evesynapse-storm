name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o storm-amd64 .
      - run: GOOS=linux GOARCH=arm64 go build -trimpath -o storm-arm64 .
      - run: tar -czf storm-linux-amd64.tar.gz storm-amd64 setup.sh
      - run: tar -czf storm-linux-arm64.tar.gz storm-arm64 setup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: storm-linux-amd64
          path: storm-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: storm-linux-arm64
          path: storm-linux-arm64.tar.gz
