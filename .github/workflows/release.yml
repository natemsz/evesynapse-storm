name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o storm-amd64 .
        env:
          CGO_ENABLED: '0'
      - run: GOOS=linux GOARCH=arm64 go build -trimpath -o storm-arm64 .
        env:
          CGO_ENABLED: '0'
      - run: tar -czf storm-linux-amd64.tar.gz storm-amd64 setup.sh
      - run: tar -czf storm-linux-arm64.tar.gz storm-arm64 setup.sh
      - run: sha256sum storm-amd64 storm-arm64 storm-linux-amd64.tar.gz storm-linux-arm64.tar.gz > SHA256SUMS
      # Only a signed release is published: the checksums are signed
      # with the release key (RELEASE_SIGNING_KEY secret, the same key
      # as EveSynapse's), and stormsign refuses to sign with a key
      # whose public half is not committed in release-signing.pub.
      # If the secret is missing or wrong this step fails and no
      # release is created.
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          go run ./cmd/stormsign sign SHA256SUMS
          go run ./cmd/stormsign verify SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            storm-amd64 storm-arm64 \
            storm-linux-amd64.tar.gz storm-linux-arm64.tar.gz \
            SHA256SUMS SHA256SUMS.sig \
            --title "Storm ${GITHUB_REF_NAME}" \
            --notes "Storm warmer ${GITHUB_REF_NAME}. Bare binaries (storm-amd64, storm-arm64) per-arch tarballs with setup.sh, and SHA256SUMS signed by the release key (SHA256SUMS.sig; public half in release-signing.pub in the repo). The bare binaries' SHA-256 digests are the values for the EveSynapse release library (type: Storm)."
